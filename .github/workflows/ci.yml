name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  GODOT_VERSION: "4.7.2"
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs, links, version and community files
        run: python3 scripts/check_repo.py
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path client --import || true
      - name: Smoke test
        run: godot --headless --path client -s tests/smoke.gd | tee out.txt && grep -q SMOKE_OK out.txt
      - name: Net cache and shared river tests
        run: |
          godot --headless --path client -s tests/netcache.gd | tee n.txt && grep -q NETCACHE_OK n.txt
          godot --headless --path client -s tests/rivers.gd | tee r.txt && grep -q RIVERS_OK r.txt
          godot --headless --path client -s tests/spectate.gd | tee s.txt && grep -q SPECTATE_OK s.txt
          godot --headless --path client -s tests/mining.gd | tee m.txt && grep -q MINING_OK m.txt
          godot --headless --path client -s tests/war.gd | tee w.txt && grep -q WAR_OK w.txt && grep -q MIX_OK w.txt && grep -q NAVAL_OK w.txt
          godot --headless --path client -s tests/ai.gd | tee a.txt && grep -q AI_OK a.txt
          godot --headless --path client -s tests/farms.gd | tee f.txt && grep -q FARMS_OK f.txt
