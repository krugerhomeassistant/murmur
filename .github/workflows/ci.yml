name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  GODOT_VERSION: "4.7.2"
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Docs, links, version and community files
        run: python3 scripts/check_repo.py
      - name: GDScript lint
        run: pip install -q gdtoolkit==4.5.0 && cd client && gdlint scripts tests
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path client --import || true
      - name: Smoke test
        run: godot --headless --path client -s tests/smoke.gd | tee out.txt && grep -q SMOKE_OK out.txt
      - name: Simulation tests
        run: |
          timeout 600 godot --headless --path client -s tests/netcache.gd | tee n.txt && grep -q NETCACHE_OK n.txt
          timeout 600 godot --headless --path client -s tests/rivers.gd | tee r.txt && grep -q RIVERS_OK r.txt
          timeout 600 godot --headless --path client -s tests/spectate.gd | tee s.txt && grep -q SPECTATE_OK s.txt
          timeout 600 godot --headless --path client -s tests/mining.gd | tee m.txt && grep -q MINING_OK m.txt
          timeout 600 godot --headless --path client -s tests/war.gd | tee w.txt && grep -q WAR_OK w.txt && grep -q MIX_OK w.txt && grep -q NAVAL_OK w.txt
          timeout 600 godot --headless --path client -s tests/ai.gd | tee a.txt && grep -q AI_OK a.txt
          timeout 600 godot --headless --path client -s tests/farms.gd | tee f.txt && grep -q FARMS_OK f.txt
          timeout 600 godot --headless --path client -s tests/pmine.gd | tee p.txt && grep -q PMINE_OK p.txt
  netplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path client --import || true
      - name: Multiplayer tests
        run: |
          timeout 600 godot --headless --path client -s tests/net.gd | tee nn.txt && grep -q NET_OK nn.txt
          timeout 600 godot --headless --path client -s tests/cmd.gd | tee cc.txt && grep -q CMD_OK cc.txt
          timeout 600 godot --headless --path client -s tests/netsync.gd | tee ns.txt && grep -q NETSYNC_OK ns.txt
          timeout 600 godot --headless --path client -s tests/mp.gd | tee mp.txt && grep -q MP_OK mp.txt
          timeout 600 godot --headless --path client -s tests/pvp.gd | tee pv.txt && grep -q PVP_OK pv.txt
